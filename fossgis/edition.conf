# FOSSGIS edition settings, read by the build (sourced as POSIX sh).
# Everything that changes from year to year belongs here. Secrets and
# local paths go into local/local.env (see fossgis/local.env.example).

EDITION_NAME="FOSSGIS 2027"
EDITION_YEAR="2027"
EDITION_DATES="2027-03-09/2027-03-13"
EDITION_VENUE="audiMAX, Im Neuenheimer Feld 289, 69120 Heidelberg"
EDITION_WORKSHOP_VENUE="Mathematikum, Im Neuenheimer Feld 205, 69120 Heidelberg"

# OSM extract of the conference city
MAP_CITY="heidelberg"
# Heidelberg, Stadtkreis (admin_level=6, AGS 08221000)
OSM_RELATION="62487"
OSM_SOURCE_PBF_URL="https://download.geofabrik.de/europe/germany/baden-wuerttemberg/karlsruhe-regbez-latest.osm.pbf"

# Map center (audiMAX, Im Neuenheimer Feld 289), zoom, bbox
# "minlon,minlat,maxlon,maxlat" for Heidelberg Stadtkreis (relation 62487)
MAP_LAT="49.4174"
MAP_LON="8.6702"
MAP_ZOOM="16"
MAP_BBOX="8.573,49.351,8.794,49.460"
# Rough rectangle around audiMAX for the Leaflet demo
MAP_LEAFLET_POLYGON="49.4165,8.6690 49.4183,8.6690 49.4183,8.6714 49.4165,8.6714"

# Workshop material and desktop
WORKSHOP_URL=""
WALLPAPER="fossgis-desktop.png"

# German live defaults (feature/german-defaults)
LOCALE="de_DE.UTF-8"
LANGUAGE="de:en"
KEYMAP="de"
KEYMAP_VARIANT=""
TIMEZONE="Europe/Berlin"
PAPERSIZE="a4"
