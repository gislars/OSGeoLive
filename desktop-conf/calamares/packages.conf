# Lubuntu packages.conf plus the removal of the live-only packages: the
# merged filesystem.squashfs of OSGeoLive contains the live layer, which
# Lubuntu itself never installs (see bin/build_chroot.sh).
# initramfs-tools and its helpers stay, the live layer replaces dracut by
# them and settings.conf uses the initramfs module instead of dracut.
update_db: true
ignore_update_db_error: true
backend: apt
operations:
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - language-pack-kde-$LOCALE
      - hunspell-$LOCALE
      - libreoffice-help-$LOCALE
      - libreoffice-l10n-$LOCALE
  - try_remove:
      - casper
      - calamares
      - calamares-data
      - calamares-settings-lubuntu
      - calamares-settings-ubuntu-common
      - calamares-settings-ubuntu-common-data
      - libcalamares3.3
      - libcalamaresui3.3
      - lubuntu-installer-prompt
      - localechooser-data
      - user-setup
      - zram-config
