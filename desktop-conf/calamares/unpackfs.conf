# OSGeoLive merges the stacked squashfs layers of Lubuntu (minimal,
# minimal.standard, minimal.standard.live) into one filesystem.squashfs,
# see bin/build_chroot.sh. It is installed as a whole, the live-only
# packages are removed again by packages.conf.
unpack:
    -   source: "/cdrom/casper/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: true
