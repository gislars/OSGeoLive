# OSGeoLive pycsw via osgeolive-venv (SQLAlchemy 1.4 + legacy-cgi + pycsw).
# Disables reliance on Deb python3-pycsw under system SQLAlchemy 2.0.

WSGIDaemonProcess osgeolive-pycsw \
    python-home=/opt/osgeolive-venv \
    user=www-data \
    group=www-data \
    processes=2 \
    threads=5 \
    display-name=%{GROUP}

WSGIProcessGroup osgeolive-pycsw
# application-group=%{GLOBAL} is required for this venv daemon (otherwise
# native modules like numpy fail to load). Other WSGI apps must use their
# own daemon process-group so they are not forced into this python-home.
WSGIScriptAlias /pycsw /usr/local/share/pycsw/wsgi.py \
    process-group=osgeolive-pycsw application-group=%{GLOBAL}

Alias /pycsw/tests /usr/share/pycsw/tests

<Directory /usr/local/share/pycsw>
    Require all granted
</Directory>

<Directory /usr/share/pycsw/tests>
    Require all granted
</Directory>

<Location /pycsw>
    Require all granted
    SetEnv PYCSW_ROOT /usr/share/pycsw
    SetEnv PYCSW_CONFIG /etc/pycsw/default.cfg
</Location>
