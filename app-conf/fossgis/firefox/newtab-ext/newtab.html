<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neuer Tab</title>
  <style>
    :root {
      --orange: #ee7f00;
      --bg: #1a1a1a;
      --card: rgba(255, 255, 255, 0.92);
      --text: #222;
      --muted: #555;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "DejaVu Sans", "Liberation Sans", sans-serif;
      background: var(--bg) url("logo.png") center / min(55vmin, 520px) no-repeat;
      color: #fff;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 2rem 1.25rem 12vh;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 45%, transparent 70%);
    }
    h1 {
      margin: 0 0 1.25rem;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      max-width: 40rem;
    }
    a.card {
      display: block;
      min-width: 11rem;
      padding: 1rem 1.25rem;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      border-radius: 8px;
      border-bottom: 3px solid var(--orange);
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      text-align: center;
    }
    a.card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }
    a.card strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 0.25rem;
    }
    a.card span {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>OSGeoLive 17 · FOSSGIS 2027</h1>
    <div class="links">
      <a class="card" href="https://fossgis-konferenz.de/2027/">
        <strong>Konferenz</strong>
        <span>Website Heidelberg 2027</span>
      </a>
      <a class="card" href="https://pretalx.com/fossgis2027/schedule/">
        <strong>Fahrplan</strong>
        <span>Programm und Sessions</span>
      </a>
      <a class="card" href="http://localhost/">
        <strong>Hilfe</strong>
        <span>Lokale Startseite</span>
      </a>
    </div>
  </main>
</body>
</html>
